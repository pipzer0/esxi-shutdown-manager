services:
  shutdown-manager:
    build: .
    container_name: esxi-shutdown-manager
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./ssh:/app/ssh:ro
    environment:
      - ESXI_HOST=rack1.springfield
      - ESXI_USER=root
      - ESXI_KEY_PATH=/app/ssh/id_rsa
      - DB_PATH=/app/data/shutdown_manager.db
      - TZ=America/Los_Angeles
